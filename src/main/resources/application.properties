spring.application.name=DeliveryDavid
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/proyecto_david?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=true
spring.flyway.enabled=false
server.port=${PORT:8080}
server.servlet.context-path=/api
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.forward-headers-strategy=none
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=22MB
server.tomcat.max-part-count=40
server.tomcat.max-parameter-count=200
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080/api}
app.storage-root=${APP_STORAGE_ROOT:RIDE_MEAL}
app.storage-max-bytes=${APP_STORAGE_MAX_BYTES:5368709120}
app.require-https=false
app.security.login-lock-minutes=15
logging.level.org.springframework.security=INFO
