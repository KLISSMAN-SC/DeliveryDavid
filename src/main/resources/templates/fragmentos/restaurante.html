<div th:fragment="vista" class="vista-restaurante fade-in">

    <!-- Botón Volver -->
    <button class="btn-volver" onclick="volverInicio()">
        <i class="fa-solid fa-arrow-left"></i> Volver
    </button>

    <!-- CABECERA DEL RESTAURANTE (Logo y Nombre Centrados) -->
    <div class="restaurante-header-centrado">
        <div class="restaurante-logo-caja">
            <!-- Valida si hay logo guardado, sino pone un icono por defecto -->
            <img th:if="${negocio.imagenLogo != null and !negocio.imagenLogo.isEmpty()}" 
                 th:src="@{'/imagenes/' + ${negocio.imagenLogo}}" 
                 alt="Logo Restaurante">
            <div th:unless="${negocio.imagenLogo != null and !negocio.imagenLogo.isEmpty()}" class="logo-placeholder">
                <i class="fa-solid fa-store"></i>
            </div>
        </div>
        <div class="restaurante-info-texto">
            <h1 th:text="${negocio.nombre}">Nombre del Restaurante</h1>
            
            <div class="restaurante-tags">
                <span class="tag-estrellas"><i class="fa-solid fa-star"></i> 4.8 (120 opiniones)</span>
                <span class="tag-estado" th:text="${negocio.estado}">ABIERTO</span>
            </div>
            
            <p class="restaurante-direccion">
                <i class="fa-solid fa-location-dot"></i> <span th:text="${negocio.direccion}">Dirección</span>
            </p>
        </div>
    </div>

    <hr class="separador-sutil">

    <!-- BARRA DE BÚSQUEDA Y CATEGORÍAS INTERNAS -->
    <div class="restaurante-navegacion">
        <div class="search-container-interno">

    		<i class="fa-solid fa-magnifying-glass"></i>
    		<input
        	type="text"
       		id="buscarProductos"
        	placeholder="Buscar productos..."
        	class="search-input-interno"
        	th:data-negocio="${negocio.idNegocio}"
        	autocomplete="off">

		</div>
        
        <!-- Botones de categorías tipo píldora -->
        <ul class="restaurante-categorias-pills">
            <li class="pill activo">Recomendados</li>
            <li class="pill">Platos principales</li>
            <li class="pill">Bebidas</li>
            <li class="pill">Complementos</li>
        </ul>
    </div>

    <!-- LAYOUT PRINCIPAL (2 Columnas) -->
    <div class="restaurante-layout">
        
        <!-- Columna Izquierda: Lista de Productos -->
        <div class="restaurante-productos-seccion">
            <div class="titulo-seccion-productos">
                <h2>Platos recomendados</h2>
                <span class="tag-fotos"><i class="fa-regular fa-circle-check"></i> Fotos referenciales</span>
            </div>
			<div class="grid-productos-interno"
     		id="listaProductos"
     		th:fragment="listaProductos">

    		<article class="tarjeta-producto"
             th:each="producto : ${productos}">


        		<div class="producto-img-caja">

            		<img
                		th:if="${producto.imagen != null and !producto.imagen.isEmpty()}"
                		th:src="@{'/productos/' + ${producto.imagen}}"
                		alt="Producto">


            	<div
                		th:unless="${producto.imagen != null and !producto.imagen.isEmpty()}"
                		class="producto-placeholder">

                		<i class="fa-solid fa-utensils"></i>

            	</div>

        </div>


        <div class="producto-info">

            <h3 th:text="${producto.nombre}">
                Nombre Producto
            </h3>


            <p class="producto-desc"
               th:text="${producto.descripcion}">
                Descripción
            </p>


            <div class="producto-footer">

                <span class="producto-precio">

                    S/

                    <span th:text="${producto.precio}">
                        0.00
                    </span>

                </span>


               		 <button
                    type="button"
                    class="btn-add-carrito"
                    th:data-producto="${producto.idProducto}"
                    th:data-negocio="${negocio.idNegocio}"
                    onclick="agregarAlCarrito(this)">

                    <i class="fa-solid fa-plus"></i>

                	</button>

            	</div>

        	</div>

    	</article>


    <!-- Si la búsqueda no encontró nada -->
    			<div class="productos-no-encontrados"
         		th:if="${#lists.isEmpty(productos)}">

        		<i class="fa-solid fa-magnifying-glass"></i>

        	<p>No encontramos productos con ese nombre.</p>

    		</div>

		</div>
           
        </div>

        <!-- Columna Derecha: Carrito Flotante -->
        <div class="restaurante-carrito-sidebar">
            <div class="carrito-box">
                <h3>Mi pedido</h3>
                
                <!-- Estado vacío del carrito -->
               <div id="contenido-carrito">

        		<div class="carrito-vacio">

            		<i class="fa-solid fa-bag-shopping"></i>

            		<p>Tu pedido está vacío</p>

        		</div>

    		   </div>
                
                <!-- Aquí se inyectarán los items del carrito mediante JavaScript después -->
            </div>
        </div>

    </div>
    
</div>
