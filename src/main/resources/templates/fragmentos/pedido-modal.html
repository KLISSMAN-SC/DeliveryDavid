<div class="modal-pedido-overlay" id="modalPedido" th:data-google-key="${googleMapsKey}" th:data-negocio="${carrito.negocio.idNegocio}" th:data-negocio-lat="${carrito.negocio.latitud}" th:data-negocio-lng="${carrito.negocio.longitud}" th:fragment="modalPedido">
<div class="modal-pedido-contenido">
<!-- CABECERA -->
<div class="pedido-modal-header">
<button class="btn-cerrar-pedido" data-argc="0" data-click="cerrarModalPedido" type="button">
<i class="fa-solid fa-arrow-left"></i>
</button>
<h2>Tu pedido</h2>
</div>
<!-- =============================== -->
<!-- DIRECCIONES -->
<!-- =============================== -->
<section class="pedido-seccion">
<h3><i class="fa-solid fa-location-dot"></i> Dirección de entrega</h3>
<!-- SI TIENE DIRECCIONES -->
<div class="lista-direcciones" th:if="${!#lists.isEmpty(direcciones)}">
<label class="direccion-opcion" th:each="direccion : ${direcciones}">
<input data-argc="1" data-change="recalcularEnvioPedido" data-self0="true" name="direccionPedido" th:checked="${direccionSeleccionada != null and direccion.idDireccionUsuario == direccionSeleccionada.idDireccionUsuario}" th:data-direccion="${direccion.direccion}" th:data-latitud="${direccion.latitud}" th:data-longitud="${direccion.longitud}" th:data-referencia="${direccion.referencia}" th:value="${direccion.idDireccionUsuario}" type="radio"/>
<div class="direccion-info">
<strong th:text="${direccion.alias}">Casa</strong>
<span th:text="${direccion.direccion}">Dirección</span>
<small th:if="${direccion.referencia != null and !direccion.referencia.isEmpty()}" th:text="${direccion.referencia}">Referencia</small>
<span class="direccion-principal" th:if="${direccion.principal}">Principal</span>
</div>
</label>
</div>
<!-- SIN DIRECCIONES -->
<div class="sin-direcciones" style="color: var(--texto-secundario); font-size: 13px;" th:if="${#lists.isEmpty(direcciones)}">
<p>No tienes una dirección registrada.</p>
</div>
</section>
<button class="btn-agregar-direccion" data-arg0="pedido" data-argc="1" data-click="abrirModalAgregarDireccion" type="button">
<i class="fa-solid fa-plus"></i>

   		Agregar dirección

		</button>
<!-- =============================== -->
<!-- MAPA -->
<!-- =============================== -->
<section class="pedido-mapa-seccion" th:if="${direccionSeleccionada != null}">
<div class="direccion-seleccionada-texto">
<i class="fa-solid fa-location-dot"></i>
<div>
<strong id="aliasMapa">Ubicación de entrega</strong>
<p id="direccionMapa" style="margin: 0;" th:text="${direccionSeleccionada.direccion}"></p>
<small id="referenciaMapa" th:text="${direccionSeleccionada.referencia}"></small>
</div>
</div>
<!-- GOOGLE MAPS EMBED -->
<div class="mapa-pedido-contenedor">
<iframe allowfullscreen="" class="mapa-pedido" height="240" id="mapaPedido" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" style="border:0;" tabindex="-1" th:src="|https://www.google.com/maps/embed/v1/directions?key=${googleMapsKey}&amp;origin=${carrito.negocio.latitud},${carrito.negocio.longitud}&amp;destination=${direccionSeleccionada.latitud},${direccionSeleccionada.longitud}&amp;mode=driving&amp;units=metric|" width="100%"></iframe>
</div>
</section>
<!-- =============================== -->
<!-- PAGO -->
<!-- =============================== -->
<section class="pedido-seccion">
<h3><i class="fa-solid fa-wallet"></i> Método de pago</h3>
<select class="select-pago" id="metodoPagoPedido">
<option value="EFECTIVO">Efectivo</option>
<option value="YAPE">Yape</option>
<option value="PLIN">Plin</option>
</select>
</section>
<!-- =============================== -->
<!-- PRODUCTOS -->
<!-- =============================== -->
<section class="pedido-seccion" style="border-bottom: none;">
<h3><i class="fa-solid fa-utensils"></i> Detalle del pedido</h3>
<div class="pedido-producto" th:each="detalle : ${carrito.detalles}">
<div>
<strong th:text="${detalle.producto.nombre}">Producto</strong>
<span>x <span th:text="${detalle.cantidad}">1</span></span>
</div>
<strong>S/ <span th:text="${#numbers.formatDecimal(detalle.precioUnitario * detalle.cantidad, 1, 2)}">0.00</span></strong>
</div>
</section>
<!-- =============================== -->
<!-- TOTALES (Fondo oscuro) -->
<!-- =============================== -->
<section class="pedido-resumen">
<h3>Resumen del pedido</h3>
<div>
<span>Productos</span>
<strong>S/ <span id="subtotalPedido" th:text="${#numbers.formatDecimal(subtotal, 1, 2)}">0.00</span></strong>
</div>
<div>
<div>
<span>Envío</span>
<!--  
        	<small id="distanciaDeliveryPedido" th:text="${direccionSeleccionada != null ? '(' + #numbers.formatDecimal(distanciaKm,1, 2  ) + ' km)': ''}"></small>
    		-->
</div>
<strong>
        		S/
        	<span id="costoEnvioPedido" th:text="${#numbers.formatDecimal(envio,1,2)}">0.00
        	</span>
</strong>
</div>
<hr/>
<div class="pedido-total">
<span>Total a pagar</span>
<strong>S/ <span id="totalPedido" th:data-base="${total}" th:text="${#numbers.formatDecimal(total, 1, 2)}">0.00</span></strong>
</div>
<!-- BOTÓN FINAL -->
<button class="btn-hacer-pedido" data-argc="1" data-click="confirmarPedido" data-self0="true" th:data-carrito="${carrito.idCarrito}" th:data-negocio="${carrito.negocio.idNegocio}" th:disabled="${#lists.isEmpty(direcciones)}" type="button">
                Hacer pedido
            </button>
</section>
</div>
</div>
