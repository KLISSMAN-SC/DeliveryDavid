<div class="modal-direccion-overlay" id="modalDireccion" th:data-google-key="${googleMapsKey}" th:fragment="modalDireccion">
<div class="modal-direccion-box">
<!-- CERRAR -->
<button class="btn-cerrar-direccion" data-argc="0" data-click="cerrarModalDireccion" type="button">
<i class="fa-solid fa-xmark"></i>
</button>
<!-- ====================================== -->
<!-- PASO 1: ELEGIR CÓMO AGREGAR DIRECCIÓN -->
<!-- ====================================== -->
<div class="direccion-paso" id="pasoElegirDireccion">
<div class="direccion-icono-principal">
<i class="fa-solid fa-location-dot"></i>
</div>
<h2>
                Agregar dirección
            </h2>
<p class="direccion-subtitulo">

                Elige cómo deseas registrar
                tu ubicación de entrega.

            </p>
<!-- UBICACIÓN ACTUAL -->
<button class="direccion-opcion-principal" data-argc="0" data-click="detectarUbicacionActual" type="button">
<div class="direccion-opcion-icono">
<i class="fa-solid fa-location-crosshairs"></i>
</div>
<div class="direccion-opcion-texto">
<strong>
                        Detectar mi ubicación
                    </strong>
<span>
                        Usar la ubicación actual
                        de este dispositivo
                    </span>
</div>
<i class="fa-solid fa-chevron-right"></i>
</button>
</div>
<!-- ====================================== -->
<!-- PASO 2: UBICACIÓN DETECTADA -->
<!-- ====================================== -->
<div class="direccion-paso oculto" id="pasoConfirmarDireccion">
<button class="btn-volver-direccion" data-argc="0" data-click="volverElegirDireccion" type="button">
<i class="fa-solid fa-arrow-left"></i>
</button>
<h2>
                Confirma tu ubicación
            </h2>
<p class="direccion-subtitulo">

                Verifica el punto detectado
                y completa los datos.

            </p>
<!-- MAPA -->
<div class="mapa-nueva-direccion-contenedor">
<iframe allowfullscreen="" class="mapa-nueva-direccion" id="mapaNuevaDireccion" loading="lazy">
</iframe>
</div>
<!-- COORDENADAS -->
<input id="nuevaLatitud" type="hidden"/>
<input id="nuevaLongitud" type="hidden"/>
<!-- FORMULARIO -->
<div class="campo-direccion">
<label for="aliasDireccion">
                    Nombre de la dirección
                </label>
<div class="input-direccion-wrapper">
<i class="fa-solid fa-house"></i>
<input id="aliasDireccion" placeholder="Casa, Trabajo, Universidad..." type="text"/>
</div>
</div>
<div class="campo-direccion">
<label for="direccionTexto">
                    Dirección
                </label>
<div class="input-direccion-wrapper">
<i class="fa-solid fa-road"></i>
<input id="direccionTexto" placeholder="Jr. Puerto Callao 250" type="text"/>
</div>
</div>
<div class="campo-direccion">
<label for="referenciaDireccion">
                    Referencia
                </label>
<div class="input-direccion-wrapper">
<i class="fa-solid fa-map-pin"></i>
<input id="referenciaDireccion" placeholder="Frente al parque, casa naranja..." type="text"/>
</div>
</div>
<button class="btn-guardar-direccion" data-argc="0" data-click="guardarNuevaDireccion" type="button">
<i class="fa-solid fa-floppy-disk"></i>

                Guardar dirección

            </button>
</div>
<!-- ====================================== -->
<!-- PASO MANUAL -->
<!-- ====================================== -->
<div class="direccion-paso oculto" id="pasoDireccionManual">
<button class="btn-volver-direccion" data-argc="0" data-click="volverElegirDireccion" type="button">
<i class="fa-solid fa-arrow-left"></i>
</button>
<h2>
                Ingresa tu dirección
            </h2>
<p class="direccion-subtitulo">

                Completa los datos manualmente.

            </p>
<div class="campo-direccion">
<label for="aliasDireccionManual">
                    Nombre
                </label>
<input id="aliasDireccionManual" placeholder="Casa, Trabajo..." type="text"/>
</div>
<div class="campo-direccion">
<label for="direccionTextoManual">
                    Dirección
                </label>
<input id="direccionTextoManual" placeholder="Av. Centenario 450" type="text"/>
</div>
<div class="campo-direccion">
<label for="referenciaDireccionManual">
                    Referencia
                </label>
<input id="referenciaDireccionManual" placeholder="Frente al parque..." type="text"/>
</div>
</div>
</div>
</div>
