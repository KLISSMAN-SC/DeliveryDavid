<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - RIDE MEAL</title>
    
    <!-- Conexión al archivo CSS externo -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    
    <!-- Librería FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="body-login">

    <div class="login-wrapper">
        <div class="login-card">
            
            <!-- Logo -->
            <div class="logo-container" style="justify-content: center; margin-bottom: 20px;">
                <strong><span class="logo-italic">RIDE</span> <span class="logo-orange">MEAL</span></strong>
            </div>
            
            <h2>Iniciar sesión</h2>
            <p class="login-subtitulo">Bienvenido de nuevo, ingresa tus credenciales.</p>

            <!-- Formulario -->
            <form th:action="@{/login}" method="POST">
                
                <div class="input-group-login">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" name="username" placeholder="Correo electrónico" required autocomplete="email">
                </div>
                
                <div class="input-group-login">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" placeholder="Contraseña" required>
                </div>
                
                <div class="login-opciones">
                    <label style="cursor: pointer;"><input type="checkbox" name="remember-me"> Recordarme</label>
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <!-- Reutilizamos la clase del botón del modal para que tenga el mismo diseño ancho y naranja -->
                <button type="submit" class="btn-aceptar" style="margin-top: 10px;">Ingresar</button>
                
            </form>

            <div class="login-footer">
                <p>¿No tienes una cuenta? <a href="#">Regístrate aquí</a></p>
                
                <hr class="separador-sutil">
                
                <a th:href="@{/}" class="volver-inicio">
                    <i class="fa-solid fa-arrow-left"></i> Volver al inicio
                </a>
            </div>
            
        </div>
    </div>

</body>
</html>
