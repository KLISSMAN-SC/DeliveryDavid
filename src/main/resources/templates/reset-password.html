<!DOCTYPE html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<title>Crear Nueva Contraseña - Dablyn Delivery</title>
<link rel="icon" th:href="@{/banner/favicon.png}" type="image/png"/>
<link rel="stylesheet" th:href="@{/css/estilos.css}"/>
<link rel="stylesheet" th:href="@{/vendor/fontawesome/css/all.min.css}"/>
<meta name="_csrf" th:content="${_csrf.token}"/><meta name="_csrf_header" th:content="${_csrf.headerName}"/><meta name="app-context" th:content="@{/}"/><script th:src="@{/js/security.js}"></script></head>
<body class="body-login">
<div class="login-wrapper">
<div class="login-card" style="max-width: 450px;">
<p role="alert" style="color:#ff5555" th:if="${error}" th:text="${error}"></p><div class="logo-container" style="justify-content: center; margin-bottom: 20px;">
<strong><span class="logo-italic">Dablyn</span> <span class="logo-orange">Delivery</span></strong>
</div>
<h2>Nueva contraseña</h2>
<p class="login-subtitulo">Crea una contraseña segura para tu cuenta.</p>
<form id="formReset" method="POST" th:action="@{/recuperar-password/reset}">
<!-- Enviamos el token oculto para que el backend sepa de quién es -->
<input name="token" th:value="${token}" type="hidden"/>
<div class="input-group-login" style="margin-bottom: 5px;">
<i class="fa-solid fa-lock"></i>
<input autocomplete="new-password" data-argc="0" data-input="validarPassword" id="inputPassword" minlength="12" name="password" placeholder="Nueva contraseña" required="" type="password"/>
<i class="fa-solid fa-eye-slash" data-arg0="inputPassword" data-arg1="togglePassword1" data-argc="2" data-click="toggleVisibilidad" id="togglePassword1" style="cursor: pointer; position: absolute; right: 15px; color: var(--texto-secundario);"></i>
</div>
<!-- Contenedor de validación visual -->
<div class="password-requisitos" id="passwordRequisitos">
<div class="req-item" id="req-long"><i class="fa-solid fa-circle-xmark"></i> Mínimo 8 caracteres</div>
<div class="req-item" id="req-mayus"><i class="fa-solid fa-circle-xmark"></i> Una mayúscula</div>
<div class="req-item" id="req-minus"><i class="fa-solid fa-circle-xmark"></i> Una minúscula</div>
<div class="req-item" id="req-especial"><i class="fa-solid fa-circle-xmark"></i> Un carácter especial</div>
</div>
<div class="input-group-login">
<i class="fa-solid fa-lock"></i>
<input data-argc="0" data-input="validarPassword" id="inputConfirmPassword" placeholder="Confirmar contraseña" required="" type="password"/>
<i class="fa-solid fa-eye-slash" data-arg0="inputConfirmPassword" data-arg1="togglePassword2" data-argc="2" data-click="toggleVisibilidad" id="togglePassword2" style="cursor: pointer; position: absolute; right: 15px; color: var(--texto-secundario);"></i>
</div>
<p id="mensajeCoincidencia" style="color: #ff5555; font-size: 12px; text-align: left; margin-top: -10px; margin-bottom: 15px; display: none; font-weight: bold;">Las contraseñas no coinciden.</p>
<button class="btn-aceptar btn-deshabilitado" disabled="" id="btnRestablecer" type="submit">Guardar contraseña</button>
</form>
</div>
</div>
<script th:src="@{/js/sesion.js}"></script>
</body>
</html>
