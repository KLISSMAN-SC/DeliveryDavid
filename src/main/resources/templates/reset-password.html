<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Nueva Contraseña - Dablyn Delivery</title>
    <link rel="icon" type="image/png" th:href="@{/banner/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="body-login">
    <div class="login-wrapper">
        <div class="login-card" style="max-width: 450px;">
            
            <div class="logo-container" style="justify-content: center; margin-bottom: 20px;">
                <strong><span class="logo-italic">Dablyn</span> <span class="logo-orange">Delivery</span></strong>
            </div>
            
            <h2>Nueva contraseña</h2>
            <p class="login-subtitulo">Crea una contraseña segura para tu cuenta.</p>

            <form th:action="@{/recuperar-password/reset}" method="POST" id="formReset">
                <!-- Enviamos el token oculto para que el backend sepa de quién es -->
                <input type="hidden" name="token" th:value="${token}">
                
                <div class="input-group-login" style="margin-bottom: 5px;">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" id="inputPassword" placeholder="Nueva contraseña" required onkeyup="validarPassword()">
                    <i class="fa-solid fa-eye-slash" id="togglePassword1" style="cursor: pointer; position: absolute; right: 15px; color: var(--texto-secundario);" onclick="toggleVisibilidad('inputPassword', 'togglePassword1')"></i>
                </div>

                <!-- Contenedor de validación visual -->
                <div class="password-requisitos" id="passwordRequisitos">
                    <div class="req-item" id="req-long"><i class="fa-solid fa-circle-xmark"></i> Mínimo 8 caracteres</div>
                    <div class="req-item" id="req-mayus"><i class="fa-solid fa-circle-xmark"></i> Una mayúscula</div>
                    <div class="req-item" id="req-minus"><i class="fa-solid fa-circle-xmark"></i> Una minúscula</div>
                    <div class="req-item" id="req-especial"><i class="fa-solid fa-circle-xmark"></i> Un carácter especial</div>
                </div>

                <div class="input-group-login">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="inputConfirmPassword" placeholder="Confirmar contraseña" required onkeyup="validarPassword()">
                    <i class="fa-solid fa-eye-slash" id="togglePassword2" style="cursor: pointer; position: absolute; right: 15px; color: var(--texto-secundario);" onclick="toggleVisibilidad('inputConfirmPassword', 'togglePassword2')"></i>
                </div>
                
                <p id="mensajeCoincidencia" style="color: #ff5555; font-size: 12px; text-align: left; margin-top: -10px; margin-bottom: 15px; display: none; font-weight: bold;">Las contraseñas no coinciden.</p>

                <button type="submit" id="btnRestablecer" class="btn-aceptar btn-deshabilitado" disabled>Guardar contraseña</button>
            </form>
        </div>
    </div>

    
    <script th:src="@{/js/sesion.js}"></script>
</body>
</html>
