<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - Dablyn Delivery</title>
    
    <!-- Conexión al archivo CSS externo -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    
    <!-- Librería FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="body-login">

    <div class="login-wrapper">
        <div class="login-card">
            
            <!-- Logo -->
            <div class="logo-container" style="justify-content: center; margin-bottom: 20px;">
                <strong><span class="logo-italic">Dablyn</span> <span class="logo-orange">Delivery</span></strong>
            </div>
            
            <h2>Recuperar contraseña</h2>
            <p class="login-subtitulo" style="margin-bottom: 25px;">
                Ingresa el correo electrónico asociado a tu cuenta y te enviaremos las instrucciones para restablecerla.
            </p>
			
            <!-- ALERTA DE ERROR (Si el correo no existe en la BD) -->
            <div th:if="${error}" style="background-color: rgba(255, 85, 85, 0.1); color: #ff5555; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px; border: 1px solid rgba(255, 85, 85, 0.3);">
                <i class="fa-solid fa-circle-xmark"></i> No encontramos ninguna cuenta con ese correo.
            </div>

            <!-- ALERTA DE ÉXITO (Cuando el correo se envía correctamente) -->
            <div th:if="${exito}" style="background-color: rgba(37, 211, 102, 0.1); color: #25D366; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px; border: 1px solid rgba(37, 211, 102, 0.3);">
                <i class="fa-solid fa-paper-plane"></i> ¡Instrucciones enviadas! Revisa tu bandeja de entrada o spam.
            </div>
			
            <!-- Formulario -->
            <form th:action="@{/recuperar-password}" method="POST" id="formRecuperar" onsubmit="mostrarCarga()">
                
                <div class="input-group-login">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" name="correo" id="inputCorreo" placeholder="Correo electrónico" required autocomplete="email">
                </div>

                <button type="submit" id="btnRecuperar" class="btn-aceptar" style="margin-top: 15px;">
                    <span id="btnTexto">Enviar instrucciones</span>
                    <i id="btnIcono" class="fa-solid fa-spinner fa-spin" style="display: none; margin-left: 8px;"></i>
                </button>
                
            </form>

            <div class="login-footer">
                <hr class="separador-sutil">
                
                <a th:href="@{/login}" class="volver-inicio">
                    <i class="fa-solid fa-arrow-left"></i> Volver a Iniciar Sesión
                </a>
            </div>
            
        </div>
    </div>

   
    <script th:src="@{/js/sesion.js}"></script>
</body>
</html>
