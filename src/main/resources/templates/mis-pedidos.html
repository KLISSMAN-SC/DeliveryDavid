
<!DOCTYPE html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>
        Mis pedidos | Dablyn Delivery
    </title>
<link rel="icon" th:href="@{/banner/favicon.png}" type="image/png"/>
<!-- Conexión al archivo CSS externo -->
<link rel="stylesheet" th:href="@{/css/estilos.css}"/>
<link rel="stylesheet" th:href="@{/css/mapa.css}"/>
<link rel="stylesheet" th:href="@{/css/direccion.css}"/>
<link rel="stylesheet" th:href="@{/css/pedidos.css}"/>
<!-- Librería FontAwesome para los íconos de redes sociales -->
<link rel="stylesheet" th:href="@{/vendor/fontawesome/css/all.min.css}"/>
<meta name="_csrf" th:content="${_csrf.token}"/><meta name="_csrf_header" th:content="${_csrf.headerName}"/><meta name="app-context" th:content="@{/}"/><script th:src="@{/js/security.js}"></script></head>
<body class="pagina-mis-pedidos">
<!-- ===================================== -->
<!-- PANTALLA DE CARGA (TRANSICIÓN) -->
<!-- ===================================== -->
<div id="pantalla-carga">
<div class="loader-circulo"></div>
</div>
<main class="mis-pedidos-contenedor">
<!-- ===================================== -->
<!-- CABECERA -->
<!-- ===================================== -->
<div class="mis-pedidos-header">
<a class="btn-volver-pedidos" th:href="@{/}">
<i class="fa-solid fa-arrow-left"></i>
</a>
<div>
<h1>
                Mis pedidos
            </h1>
<p>
                Consulta el historial
                de tus pedidos realizados.
            </p>
</div>
</div>
<!-- ===================================== -->
<!-- FILTROS -->
<!-- ===================================== -->
<!-- ===================================== -->
<!-- SIN PEDIDOS -->
<!-- ===================================== -->
<div class="pedidos-vacio" th:if="${#lists.isEmpty(pedidos)}">
<i class="fa-solid fa-bag-shopping"></i>
<h2>
            Aún no tienes pedidos
        </h2>
<p>
            Cuando realices tu primer pedido,
            aparecerá aquí.
        </p>
<a th:href="@{/}">
            Ir al catálogo
        </a>
</div>
<!-- ===================================== -->
<!-- PEDIDOS -->
<!-- ===================================== -->
<div class="grid-mis-pedidos" th:if="${!#lists.isEmpty(pedidos)}">
<article class="pedido-cliente-card" th:data-estado="${pedido.estadoPedido}" th:each="pedido : ${pedidos}">
<!-- NEGOCIO -->
<div class="pedido-card-header">
<div class="pedido-negocio-logo">
<img th:if="${pedido.negocio.imagenLogo != null}" th:src="@{'/imagenes/' + ${pedido.negocio.imagenLogo}}"/>
<i class="fa-solid fa-store" th:unless="${pedido.negocio.imagenLogo != null}">
</i>
</div>
<div class="pedido-card-negocio">
<h3 th:text="${pedido.negocio.nombre}">

                        Restaurante

                    </h3>
<span>

                        Pedido #

                        <span th:text="${pedido.idPedido}">
</span>
</span>
</div>
<!-- ESTADO -->
<!-- 
                <span
                    class="pedido-estado"
                    th:classappend="${
                        ' estado-' +
                        #strings.toLowerCase(
                            pedido.estadoPedido
                        )
                    }">


                    <span
                        th:switch="${pedido.estadoPedido}">


                        <span
                            th:case="'PENDIENTE_DE_WHATSAPP'">

                            Pendiente

                        </span>


                        <span th:case="'CONFIRMADO'">

                            Confirmado

                        </span>


                        <span th:case="'EN_CAMINO'">

                            En camino

                        </span>


                        <span th:case="'ENTREGADO'">

                            Entregado

                        </span>


                        <span th:case="'CANCELADO'">

                            Cancelado

                        </span>


                        <span
                            th:case="*"
                            th:text="${pedido.estadoPedido}">
                        </span>


                    </span>

                </span>

			 -->
</div>
<!-- FOOTER -->
<div class="pedido-card-footer">
<div>
<small>
                        TOTAL
                    </small>
<strong>

                        S/

                        <span th:text="${#numbers.formatDecimal(
                                pedido.total,
                                1,
                                2
                            )}">

                            0.00

                        </span>
</strong>
</div>
<div class="pedido-card-acciones">
<button class="btn-ver-pedido" data-argc="1" data-click="mostrarPedidoConfirmado" data-from0="pedido" th:data-pedido="${pedido.idPedido}" type="button">

    				Ver pedido

					</button>
</div>
</div>
</article>
</div>
<!-- Cuando un filtro no encuentre pedidos -->
<div class="sin-pedidos-filtro" id="sinPedidosFiltro" style="display:none;">

        No hay pedidos en esta categoría.

    </div>
</main>
<!-- PARA ABRIR DETALLE -->
<div id="contenedor-modal-pedido"></div>
<!-- TOAST -->
<div class="toast-notificacion" id="toastNotificacion">
<div class="toast-icono">
<i class="fa-solid fa-circle-check"></i>
</div>
<div class="toast-contenido">
<strong id="toastTitulo"></strong>
<span id="toastMensaje"></span>
</div>
</div>
<script th:attr="nonce=${cspNonce}" th:inline="javascript">

    window.idUsuarioValidado =
        /*[[${idUsuarioValidado}]]*/ null;

</script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/pedido.js}"></script>
<script th:src="@{/js/direccion.js}"></script>
<script th:src="@{/js/productos.js}"></script>
<script th:src="@{/js/carga.js}"></script>
</body>
</html>
