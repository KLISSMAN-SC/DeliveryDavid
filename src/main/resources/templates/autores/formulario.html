<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${autor.id != null ? 'Editar Autor' : 'Nuevo Autor'}">Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #1f4e78 !important; }
        .form-control:focus { 
            border-color: #1f4e78; 
            box-shadow: 0 0 0 0.2rem rgba(31, 78, 120, 0.25); 
        }
        .card-header { 
            background-color: #1f4e78; 
            color: white; 
        }
        .btn-primary { 
            background-color: #1f4e78; 
            border-color: #1f4e78; 
        }
        .btn-primary:hover { 
            background-color: #163a5a; 
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">📚 Biblioteca</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/api/web/autores">Autores</a></li>
                    <li class="nav-item"><a class="nav-link" href="/api/web/libros">Libros</a></li>
                    <li class="nav-item"><a class="nav-link" href="/api/web/categorias">Categorías</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0" th:text="${autor.id != null ? 'Editar Autor' : 'Nuevo Autor'}">
                            <i class="fas fa-user-plus"></i> Formulario
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/web/autores}" th:object="${autor}" method="post">
                            <input type="hidden" th:field="*{id}" />
                            
                            <div class="mb-3">
                                <label for="nombre" class="form-label">
                                    <i class="fas fa-user"></i> Nombre
                                </label>
                                <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
                                <small class="text-muted">Campo requerido</small>
                            </div>
                            
                            <div class="mb-3">
                                <label for="apellido" class="form-label">
                                    <i class="fas fa-user"></i> Apellido
                                </label>
                                <input type="text" class="form-control" id="apellido" th:field="*{apellido}" required>
                                <small class="text-muted">Campo requerido</small>
                            </div>
                            
                            <div class="mb-3">
                                <label for="fechaNacimiento" class="form-label">
                                    <i class="fas fa-calendar"></i> Fecha de Nacimiento
                                </label>
                                <input type="date" class="form-control" id="fechaNacimiento" th:field="*{fechaNacimiento}">
                                <small class="text-muted">Opcional</small>
                            </div>
                            
                            <div class="mb-3">
                                <label for="nacionalidad" class="form-label">
                                    <i class="fas fa-globe"></i> Nacionalidad
                                </label>
                                <input type="text" class="form-control" id="nacionalidad" th:field="*{nacionalidad}" placeholder="Ej: Español, Colombiano">
                                <small class="text-muted">Opcional</small>
                            </div>
                            
                            <div class="d-flex gap-2 pt-3">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Guardar
                                </button>
                                <a href="/api/web/autores" class="btn btn-secondary">
                                    <i class="fas fa-times"></i> Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
